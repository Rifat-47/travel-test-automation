default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
fail_fast: true

repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: Detect secrets
        language: system
        entry: gitleaks git --staged --redact --no-banner
        pass_filenames: false
        always_run: true
      - id: block-env
        name: Block env files
        language: fail
        entry: Env files hold credentials and must not be committed.
        files: '(^|/)\.env($|\.)'
        exclude: '(^|/)\.env\.example$'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: no-commit-to-branch
        args: ['--branch', 'main']
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=200']
      - id: check-yaml
      - id: check-json
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: local
    hooks:
      - id: lint
        name: ESLint
        language: system
        entry: npm run lint
        pass_filenames: false
      - id: format
        name: Prettier
        language: system
        entry: npm run format:check
        pass_filenames: false
      - id: test-cases
        name: Test case documents
        language: system
        entry: npm run check:cases
        pass_filenames: false
      - id: commit-message
        name: Commit message format
        stages: [commit-msg]
        language: pygrep
        entry: '\A(feat|fix|test|docs|chore|ci|refactor)(\([a-z0-9-]+\))?: .+|\AMerge '
        args: [--negate, --multiline]
